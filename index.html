<style>
body{min-height:100vh}
header{position:sticky;top:0;z-index:100}
#compare-tray{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);transition:transform .4s cubic-bezier(.175,.885,.32,1.275);z-index:1001}
#compare-tray.visible{transform:translateX(-50%) translateY(0)}
#compare-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
#compare-modal.active{display:flex}
.close-compare{cursor:pointer}
.search-results-dropdown{position:absolute;top:100%;left:0;right:0;background:#131c2e;border:1px solid var(--border);border-radius:10px;margin-top:8px;max-height:360px;overflow-y:auto;display:none;z-index:999}
.search-result-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.search-result-item:hover{background:rgba(58,160,255,.08)}
.search-result-name{font-weight:600;color:var(--text)}
.search-result-score{color:var(--accent);margin-left:8px;font-size:.85rem}
.search-result-category{color:var(--muted);font-size:.8rem}
@media(max-width:600px){header .container{flex-direction:column;align-items:flex-start;gap:12px}nav{flex-wrap:wrap;width:100%}header .search-wrapper{width:100%}}
</style>
